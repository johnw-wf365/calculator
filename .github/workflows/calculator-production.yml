name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.PRODUCTION_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://calculators.workforce365.ai
          STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          ADSENSE_CLIENT_ID: ${{ secrets.PRODUCTION_ADSENSE_CLIENT_ID }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }} \
            --build-arg NEXTAUTH_SECRET=${{ secrets.PRODUCTION_NEXTAUTH_SECRET }} \
            --build-arg NEXTAUTH_URL=https://calculators.workforce365.ai \
            --build-arg STRIPE_SECRET_KEY=${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }} \
            --build-arg ADSENSE_CLIENT_ID=${{ secrets.PRODUCTION_ADSENSE_CLIENT_ID }} \
            -t ghcr.io/${{ github.repository }}:prod-${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}:prod-latest \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:prod-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:prod-latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/calculator
            export IMAGE_TAG=prod-${{ github.sha }}
            ./scripts/deploy.sh production

      - name: Health check
        run: |
          sleep 10
          ./scripts/health-check.sh https://calculators.workforce365.ai

      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Production deployment successful
            Tag: ${{ github.event.inputs.tag || github.ref }}
            Commit: ${{ github.sha }}

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Production deployment FAILED
            Tag: ${{ github.event.inputs.tag || github.ref }}
            Commit: ${{ github.sha }}
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
