name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://staging.calculators.workforce365.ai
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          ADSENSE_CLIENT_ID: ${{ secrets.STAGING_ADSENSE_CLIENT_ID }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }} \
            --build-arg NEXTAUTH_SECRET=${{ secrets.STAGING_NEXTAUTH_SECRET }} \
            --build-arg NEXTAUTH_URL=https://staging.calculators.workforce365.ai \
            --build-arg STRIPE_SECRET_KEY=${{ secrets.STAGING_STRIPE_SECRET_KEY }} \
            --build-arg ADSENSE_CLIENT_ID=${{ secrets.STAGING_ADSENSE_CLIENT_ID }} \
            -t ghcr.io/${{ github.repository }}:staging-${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}:staging-latest \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:staging-latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/calculator
            export IMAGE_TAG=staging-${{ github.sha }}
            ./scripts/deploy.sh staging

      - name: Health check
        run: |
          sleep 10
          ./scripts/health-check.sh https://staging.calculators.workforce365.ai
